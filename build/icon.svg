<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Soft Ambient Lift Shadow -->
    <filter id="liftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- ==================== THEHIVE WINNER: PASS 5B (MINIMAL HERALDIC CREST) ==================== -->
  <!-- Strict 5 Colors: #F59E0B (Amber), #FBBF24 (Gold), #FEF08A (Honey Wing), #D97706 (Caramel Trim), #FFFBEB (Ivory) -->
  <g filter="url(#liftShadow)">
    <!-- 1. Seamless Honeycomb Hexagon Walls (#F59E0B Frame + 15% Translucent Honey Nectar Bed) -->
    <g stroke="#F59E0B" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
      <!-- Top Hexagon (Center: 512, 330) -->
      <polygon points="512,138 678,234 678,426 512,522 346,426 346,234" 
               fill="#FBBF24" fill-opacity="0.16" />

      <!-- Bottom-Left Hexagon (Center: 346, 618) -->
      <polygon points="346,426 512,522 512,714 346,810 180,714 180,522" 
               fill="#F59E0B" fill-opacity="0.14" />

      <!-- Bottom-Right Hexagon (Center: 678, 618) -->
      <polygon points="678,426 844,522 844,714 678,810 512,714 512,522" 
               fill="#F59E0B" fill-opacity="0.14" />
    </g>

    <!-- 2. Apex Cell: Bold Heraldic Queen Bee (Overmind) -->
    <g transform="translate(512, 324) scale(1.08) translate(0, -6)">
      <!-- Sweeping Faceted Wings (#FEF08A with #D97706 Border) -->
      <!-- Left Wing -->
      <path d="M -20,-30 C -68,-78 -120,-68 -124,-34 C -126,-6 -84,12 -20,4 Z" 
            fill="#FEF08A" stroke="#D97706" stroke-width="6" stroke-linejoin="round"/>
      <!-- Right Wing -->
      <path d="M 20,-30 C 68,-78 120,-68 124,-34 C 126,-6 84,12 20,4 Z" 
            fill="#FEF08A" stroke="#D97706" stroke-width="6" stroke-linejoin="round"/>

      <!-- Queen Crown & Antennae -->
      <path d="M -12,-66 Q -22,-90 -34,-106" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-34" cy="-106" r="6" fill="#FFFBEB"/>
      <path d="M 12,-66 Q 22,-90 34,-106" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
      <circle cx="34" cy="-106" r="6" fill="#FFFBEB"/>

      <!-- Triple-Point Crown -->
      <polygon points="-22,-82 -32,-104 0,-94 32,-104 22,-82" fill="#FBBF24" stroke="#D97706" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="0" cy="-94" r="6" fill="#FFFBEB"/>

      <!-- Queen Head & Thorax -->
      <circle cx="0" cy="-56" r="23" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
      <polygon points="0,-32 26,-15 26,17 0,34 -26,17 -26,-15" fill="#F59E0B" stroke="#D97706" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="0" cy="1" r="7" fill="#FFFBEB"/>

      <!-- Segmented Abdomen -->
      <path d="M -24,42 Q 0,50 24,42 L 20,60 Q 0,68 -20,60 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <path d="M -18,64 Q 0,72 18,64 L 14,80 Q 0,88 -14,80 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <polygon points="-10,84 10,84 0,108" fill="#D97706"/>
    </g>

    <!-- 3. Bottom-Left Cell: Minimalist Honey Node (Agent Core A) -->
    <g transform="translate(346, 618)">
      <polygon points="0,-64 55,-32 55,32 0,64 -55,32 -55,-32" fill="#FEF08A" stroke="#D97706" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="20" fill="#F59E0B"/>
      <circle cx="0" cy="0" r="9" fill="#FFFBEB"/>
    </g>

    <!-- 4. Bottom-Right Cell: Minimalist Honey Node (Agent Core B) -->
    <g transform="translate(678, 618)">
      <polygon points="0,-64 55,-32 55,32 0,64 -55,32 -55,-32" fill="#FEF08A" stroke="#D97706" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="20" fill="#F59E0B"/>
      <circle cx="0" cy="0" r="9" fill="#FFFBEB"/>
    </g>
  </g>
</svg>
