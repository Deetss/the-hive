<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Natural Universal Lift Shadow: grounds on white, seamless on dark -->
    <filter id="universalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- ==================== UNIVERSAL CONTRAST HONEYCOMB TRIAD ==================== -->
  <!-- Strict 5 Colors: #F59E0B, #FBBF24, #FEF08A, #D97706, #FFFBEB -->
  <g filter="url(#universalShadow)">
    <!-- 1. Vibrant Honeycomb Walls (Solid #F59E0B, bold 28px) -->
    <g fill="none" stroke="#F59E0B" stroke-width="28" stroke-linejoin="round" stroke-linecap="round">
      <!-- Top Hexagon (Center: 512, 330) -->
      <polygon points="512,140 676.5,235 676.5,425 512,520 347.5,425 347.5,235" />

      <!-- Bottom-Left Hexagon (Center: 347.5, 615) -->
      <polygon points="347.5,425 512,520 512,710 347.5,805 183,710 183,520" />

      <!-- Bottom-Right Hexagon (Center: 676.5, 615) -->
      <polygon points="676.5,425 841,520 841,710 676.5,805 512,710 512,520" />
    </g>

    <!-- 2. Top Cell: Queen Bee -->
    <g transform="translate(512, 330)">
      <!-- Queen Wings (Warm Luminous Gold #FEF08A with Rich Amber #D97706 Border) -->
      <polygon points="-25,-30 -120,-68 -98,-15 -25,5" fill="#FEF08A" stroke="#D97706" stroke-width="6"/>
      <polygon points="-25,12 -88,18 -68,60 -25,32" fill="#FEF08A" stroke="#D97706" stroke-width="5"/>
      <polygon points="25,-30 120,-68 98,-15 25,5" fill="#FEF08A" stroke="#D97706" stroke-width="6"/>
      <polygon points="25,12 88,18 68,60 25,32" fill="#FEF08A" stroke="#D97706" stroke-width="5"/>

      <!-- Queen Crown & Antennae -->
      <path d="M -12,-65 Q -22,-90 -34,-106" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-34" cy="-106" r="6" fill="#FFFBEB"/>
      <path d="M 12,-65 Q 22,-90 34,-106" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
      <circle cx="34" cy="-106" r="6" fill="#FFFBEB"/>

      <polygon points="-24,-84 -34,-106 0,-95 34,-106 24,-84" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
      <circle cx="0" cy="-95" r="7" fill="#FFFBEB"/>

      <!-- Queen Head (#FBBF24) & Thorax (#F59E0B) -->
      <circle cx="0" cy="-56" r="24" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
      <polygon points="0,-32 28,-14 28,20 0,38 -28,20 -28,-14" fill="#F59E0B" stroke="#D97706" stroke-width="4"/>
      <circle cx="0" cy="2" r="7" fill="#FFFBEB"/>

      <!-- Abdomen (#FBBF24 Segments with #D97706 Accents) -->
      <path d="M -26,46 Q 0,54 26,46 L 22,64 Q 0,72 -22,64 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <path d="M -20,70 Q 0,78 20,70 L 15,88 Q 0,96 -15,88 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <polygon points="-11,94 11,94 0,118" fill="#D97706"/>
    </g>

    <!-- 3. Bottom-Left Cell: Worker Bee A -->
    <g transform="translate(347.5, 615) scale(0.8) translate(0, -10)">
      <!-- Wings (#FEF08A with #D97706 Border) -->
      <polygon points="-20,-25 -100,-58 -82,-10 -20,5" fill="#FEF08A" stroke="#D97706" stroke-width="6"/>
      <polygon points="20,-25 100,-58 82,-10 20,5" fill="#FEF08A" stroke="#D97706" stroke-width="6"/>
      <!-- Head & Thorax -->
      <circle cx="0" cy="-46" r="20" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
      <ellipse cx="0" cy="-12" rx="24" ry="20" fill="#F59E0B" stroke="#D97706" stroke-width="4"/>
      <!-- Abdomen -->
      <path d="M -20,14 Q 0,22 20,14 L 16,34 Q 0,42 -16,34 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <path d="M -14,40 Q 0,48 14,40 L 9,58 Q 0,66 -9,58 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <polygon points="-7,64 7,64 0,86" fill="#D97706"/>
    </g>

    <!-- 4. Bottom-Right Cell: Worker Bee B -->
    <g transform="translate(676.5, 615) scale(0.8) translate(0, -10)">
      <!-- Wings (#FEF08A with #D97706 Border) -->
      <polygon points="-20,-25 -100,-58 -82,-10 -20,5" fill="#FEF08A" stroke="#D97706" stroke-width="6"/>
      <polygon points="20,-25 100,-58 82,-10 20,5" fill="#FEF08A" stroke="#D97706" stroke-width="6"/>
      <!-- Head & Thorax -->
      <circle cx="0" cy="-46" r="20" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
      <ellipse cx="0" cy="-12" rx="24" ry="20" fill="#F59E0B" stroke="#D97706" stroke-width="4"/>
      <!-- Abdomen -->
      <path d="M -20,14 Q 0,22 20,14 L 16,34 Q 0,42 -16,34 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <path d="M -14,40 Q 0,48 14,40 L 9,58 Q 0,66 -9,58 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <polygon points="-7,64 7,64 0,86" fill="#D97706"/>
    </g>
  </g>
</svg>
