<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Premium Ambient Lift Shadow (Grounds on white, seamless on dark) -->
    <filter id="liftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- ==================== PASS 5A: THE SYMMETRICAL ROYAL SWARM ==================== -->
  <!-- Strict 5 Colors: #F59E0B (Amber), #FBBF24 (Gold), #FEF08A (Honey Wing), #D97706 (Caramel Trim), #FFFBEB (Ivory) -->
  <g filter="url(#liftShadow)">
    <!-- 1. Seamless Honeycomb Hexagon Walls (Amber #F59E0B, stroke 26px) -->
    <g fill="none" stroke="#F59E0B" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
      <!-- Top Hexagon (Center: 512, 330) -->
      <polygon points="512,138 678,234 678,426 512,522 346,426 346,234" />

      <!-- Bottom-Left Hexagon (Center: 346, 618) -->
      <polygon points="346,426 512,522 512,714 346,810 180,714 180,522" />

      <!-- Bottom-Right Hexagon (Center: 678, 618) -->
      <polygon points="678,426 844,522 844,714 678,810 512,714 512,522" />
    </g>

    <!-- 2. Apex Cell: Royal Queen Bee (Overmind) -->
    <g transform="translate(512, 326)">
      <!-- Queen Wings (Sweeping Aerodynamic Facets: #FEF08A with #D97706 Trim) -->
      <!-- Left Upper Wing -->
      <path d="M -22,-32 C -70,-80 -124,-72 -128,-36 C -130,-6 -88,12 -22,4 Z" 
            fill="#FEF08A" stroke="#D97706" stroke-width="6" stroke-linejoin="round"/>
      <!-- Left Lower Winglet -->
      <path d="M -22,12 C -60,18 -88,44 -74,68 C -60,82 -32,56 -22,30 Z" 
            fill="#FEF08A" stroke="#D97706" stroke-width="5" stroke-linejoin="round"/>

      <!-- Right Upper Wing -->
      <path d="M 22,-32 C 70,-80 124,-72 128,-36 C 130,-6 88,12 22,4 Z" 
            fill="#FEF08A" stroke="#D97706" stroke-width="6" stroke-linejoin="round"/>
      <!-- Right Lower Winglet -->
      <path d="M 22,12 C 60,18 88,44 74,68 C 60,82 32,56 22,30 Z" 
            fill="#FEF08A" stroke="#D97706" stroke-width="5" stroke-linejoin="round"/>

      <!-- Queen Crown & Antennae -->
      <path d="M -12,-68 Q -24,-94 -38,-108" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-38" cy="-108" r="6" fill="#FFFBEB"/>
      <path d="M 12,-68 Q 24,-94 38,-108" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
      <circle cx="38" cy="-108" r="6" fill="#FFFBEB"/>

      <!-- Triple-Point Crown -->
      <polygon points="-24,-86 -34,-108 0,-98 34,-108 24,-86" fill="#FBBF24" stroke="#D97706" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="0" cy="-98" r="7" fill="#FFFBEB"/>

      <!-- Queen Head & Thorax -->
      <circle cx="0" cy="-58" r="24" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
      <polygon points="0,-34 28,-16 28,18 0,36 -28,18 -28,-16" fill="#F59E0B" stroke="#D97706" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="0" cy="1" r="7" fill="#FFFBEB"/>

      <!-- Segmented Abdomen -->
      <path d="M -26,44 Q 0,52 26,44 L 22,62 Q 0,70 -22,62 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <path d="M -20,68 Q 0,76 20,68 L 15,86 Q 0,94 -15,86 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <polygon points="-11,92 11,92 0,118" fill="#D97706"/>
    </g>

    <!-- 3. Bottom-Left Cell: Worker Bee (Inward Angled 18° Toward Queen) -->
    <g transform="translate(346, 618) rotate(18) scale(0.76) translate(0, -10)">
      <!-- Wings -->
      <path d="M -20,-28 C -60,-68 -104,-60 -108,-30 C -110,-5 -74,10 -20,4 Z" fill="#FEF08A" stroke="#D97706" stroke-width="6"/>
      <path d="M 20,-28 C 60,-68 104,-60 108,-30 C 110,-5 74,10 20,4 Z" fill="#FEF08A" stroke="#D97706" stroke-width="6"/>
      
      <!-- Head & Thorax -->
      <circle cx="0" cy="-48" r="20" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
      <ellipse cx="0" cy="-14" rx="24" ry="20" fill="#F59E0B" stroke="#D97706" stroke-width="4"/>
      
      <!-- Abdomen -->
      <path d="M -20,12 Q 0,20 20,12 L 16,32 Q 0,40 -16,32 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <path d="M -14,38 Q 0,46 14,38 L 9,56 Q 0,64 -9,56 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <polygon points="-7,62 7,62 0,84" fill="#D97706"/>
    </g>

    <!-- 4. Bottom-Right Cell: Worker Bee (Inward Angled -18° Toward Queen) -->
    <g transform="translate(678, 618) rotate(-18) scale(0.76) translate(0, -10)">
      <!-- Wings -->
      <path d="M -20,-28 C -60,-68 -104,-60 -108,-30 C -110,-5 -74,10 -20,4 Z" fill="#FEF08A" stroke="#D97706" stroke-width="6"/>
      <path d="M 20,-28 C 60,-68 104,-60 108,-30 C 110,-5 74,10 20,4 Z" fill="#FEF08A" stroke="#D97706" stroke-width="6"/>
      
      <!-- Head & Thorax -->
      <circle cx="0" cy="-48" r="20" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
      <ellipse cx="0" cy="-14" rx="24" ry="20" fill="#F59E0B" stroke="#D97706" stroke-width="4"/>
      
      <!-- Abdomen -->
      <path d="M -20,12 Q 0,20 20,12 L 16,32 Q 0,40 -16,32 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <path d="M -14,38 Q 0,46 14,38 L 9,56 Q 0,64 -9,56 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <polygon points="-7,62 7,62 0,84" fill="#D97706"/>
    </g>
  </g>
</svg>
