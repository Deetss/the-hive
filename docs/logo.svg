<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Subtle Dimensional Lift Shadow -->
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- ==================== HONEYCOMB ICON (5 HIGH-CONTRAST COLORS) ==================== -->
  <!-- Colors: #78350F (Deep Brown), #F59E0B (Amber), #FBBF24 (Gold), #FEF3C7 (Cream), #D97706 (Deep Amber) -->
  <g filter="url(#subtleShadow)">
    <!-- 1. Hexagon Walls (#F59E0B with #78350F boundary stroke for crisp white contrast) -->
    <g stroke-linejoin="round" stroke-linecap="round">
      <!-- Top Hexagon (Center: 512, 330) -->
      <polygon points="512,140 676.5,235 676.5,425 512,520 347.5,425 347.5,235" 
               fill="none" stroke="#78350F" stroke-width="32" />
      <polygon points="512,140 676.5,235 676.5,425 512,520 347.5,425 347.5,235" 
               fill="none" stroke="#F59E0B" stroke-width="24" />

      <!-- Bottom-Left Hexagon (Center: 347.5, 615) -->
      <polygon points="347.5,425 512,520 512,710 347.5,805 183,710 183,520" 
               fill="none" stroke="#78350F" stroke-width="32" />
      <polygon points="347.5,425 512,520 512,710 347.5,805 183,710 183,520" 
               fill="none" stroke="#F59E0B" stroke-width="24" />

      <!-- Bottom-Right Hexagon (Center: 676.5, 615) -->
      <polygon points="676.5,425 841,520 841,710 676.5,805 512,710 512,520" 
               fill="none" stroke="#78350F" stroke-width="32" />
      <polygon points="676.5,425 841,520 841,710 676.5,805 512,710 512,520" 
               fill="none" stroke="#F59E0B" stroke-width="24" />
    </g>

    <!-- 2. Top Cell: Queen Bee -->
    <g transform="translate(512, 330)">
      <!-- Queen Wings (Cream #FEF3C7 with Deep Brown #78350F Stroke for Perfect White Legibility) -->
      <polygon points="-25,-30 -120,-68 -98,-15 -25,5" fill="#FEF3C7" stroke="#78350F" stroke-width="6"/>
      <polygon points="-25,12 -88,18 -68,60 -25,32" fill="#FEF3C7" stroke="#78350F" stroke-width="5"/>
      <polygon points="25,-30 120,-68 98,-15 25,5" fill="#FEF3C7" stroke="#78350F" stroke-width="6"/>
      <polygon points="25,12 88,18 68,60 25,32" fill="#FEF3C7" stroke="#78350F" stroke-width="5"/>

      <!-- Queen Crown & Antennae -->
      <path d="M -12,-65 Q -22,-90 -34,-106" fill="none" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-34" cy="-106" r="6" fill="#FBBF24"/>
      <path d="M 12,-65 Q 22,-90 34,-106" fill="none" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
      <circle cx="34" cy="-106" r="6" fill="#FBBF24"/>

      <polygon points="-24,-84 -34,-106 0,-95 34,-106 24,-84" fill="#FBBF24" stroke="#78350F" stroke-width="4"/>
      <circle cx="0" cy="-95" r="7" fill="#FEF3C7" stroke="#78350F" stroke-width="3"/>

      <!-- Queen Head & Thorax -->
      <circle cx="0" cy="-56" r="24" fill="#FBBF24" stroke="#78350F" stroke-width="5"/>
      <polygon points="0,-32 28,-14 28,20 0,38 -28,20 -28,-14" fill="#F59E0B" stroke="#78350F" stroke-width="5"/>
      <circle cx="0" cy="2" r="7" fill="#FEF3C7"/>

      <!-- Abdomen -->
      <path d="M -26,46 Q 0,54 26,46 L 22,64 Q 0,72 -22,64 Z" fill="#FBBF24" stroke="#78350F" stroke-width="4"/>
      <path d="M -20,70 Q 0,78 20,70 L 15,88 Q 0,96 -15,88 Z" fill="#FBBF24" stroke="#78350F" stroke-width="4"/>
      <polygon points="-11,94 11,94 0,118" fill="#D97706" stroke="#78350F" stroke-width="4"/>
    </g>

    <!-- 3. Bottom-Left Cell: Worker Bee A -->
    <g transform="translate(347.5, 615) scale(0.8) translate(0, -10)">
      <!-- Wings with Brown Outline -->
      <polygon points="-20,-25 -100,-58 -82,-10 -20,5" fill="#FEF3C7" stroke="#78350F" stroke-width="6"/>
      <polygon points="20,-25 100,-58 82,-10 20,5" fill="#FEF3C7" stroke="#78350F" stroke-width="6"/>
      <!-- Head & Thorax -->
      <circle cx="0" cy="-46" r="20" fill="#FBBF24" stroke="#78350F" stroke-width="5"/>
      <ellipse cx="0" cy="-12" rx="24" ry="20" fill="#F59E0B" stroke="#78350F" stroke-width="5"/>
      <!-- Abdomen -->
      <path d="M -20,14 Q 0,22 20,14 L 16,34 Q 0,42 -16,34 Z" fill="#FBBF24" stroke="#78350F" stroke-width="4"/>
      <path d="M -14,40 Q 0,48 14,40 L 9,58 Q 0,66 -9,58 Z" fill="#FBBF24" stroke="#78350F" stroke-width="4"/>
      <polygon points="-7,64 7,64 0,86" fill="#D97706" stroke="#78350F" stroke-width="4"/>
    </g>

    <!-- 4. Bottom-Right Cell: Worker Bee B -->
    <g transform="translate(676.5, 615) scale(0.8) translate(0, -10)">
      <!-- Wings with Brown Outline -->
      <polygon points="-20,-25 -100,-58 -82,-10 -20,5" fill="#FEF3C7" stroke="#78350F" stroke-width="6"/>
      <polygon points="20,-25 100,-58 82,-10 20,5" fill="#FEF3C7" stroke="#78350F" stroke-width="6"/>
      <!-- Head & Thorax -->
      <circle cx="0" cy="-46" r="20" fill="#FBBF24" stroke="#78350F" stroke-width="5"/>
      <ellipse cx="0" cy="-12" rx="24" ry="20" fill="#F59E0B" stroke="#78350F" stroke-width="5"/>
      <!-- Abdomen -->
      <path d="M -20,14 Q 0,22 20,14 L 16,34 Q 0,42 -16,34 Z" fill="#FBBF24" stroke="#78350F" stroke-width="4"/>
      <path d="M -14,40 Q 0,48 14,40 L 9,58 Q 0,66 -9,58 Z" fill="#FBBF24" stroke="#78350F" stroke-width="4"/>
      <polygon points="-7,64 7,64 0,86" fill="#D97706" stroke="#78350F" stroke-width="4"/>
    </g>
  </g>
</svg>
