<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="liftShadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- ==================== V6-7HEX: 7-CELL HONEYCOMB MEDALLION ==================== -->
  <!-- 1 Center + 6 Orbiting Cells — Natural, symmetrical, balanced -->
  <g filter="url(#liftShadow7)">
    <!-- 1. Surrounding 6 Hexagon Cells (Amber #F59E0B) -->
    <g fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="20" stroke-linejoin="round" stroke-linecap="round">
      <!-- Top (512, 230) -->
      <polygon points="512,90 633,160 633,300 512,370 391,300 391,160" />
      <!-- Top Right (754, 370) -->
      <polygon points="754,230 875,300 875,440 754,510 633,440 633,300" />
      <!-- Bottom Right (754, 650) -->
      <polygon points="754,510 875,580 875,720 754,790 633,720 633,580" />
      <!-- Bottom (512, 790) -->
      <polygon points="512,650 633,720 633,860 512,930 391,860 391,720" />
      <!-- Bottom Left (270, 650) -->
      <polygon points="270,510 391,580 391,720 270,790 149,720 149,580" />
      <!-- Top Left (270, 370) -->
      <polygon points="270,230 391,300 391,440 270,510 149,440 149,300" />
    </g>

    <!-- 2. Central Queen Honey Cell (512, 510) -->
    <polygon points="512,370 633,440 633,580 512,650 391,580 391,440" 
             fill="#FBBF24" fill-opacity="0.18" stroke="#F59E0B" stroke-width="24" stroke-linejoin="round"/>

    <!-- 3. Heraldic Queen Bee in Central Cell -->
    <g transform="translate(512, 508) scale(0.85) translate(0, -6)">
      <!-- Sweeping Wings -->
      <path d="M -20,-30 C -68,-78 -120,-68 -124,-34 C -126,-6 -84,12 -20,4 Z" 
            fill="#FEF08A" stroke="#D97706" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 20,-30 C 68,-78 120,-68 124,-34 C 126,-6 84,12 20,4 Z" 
            fill="#FEF08A" stroke="#D97706" stroke-width="6" stroke-linejoin="round"/>

      <!-- Crown & Head -->
      <polygon points="-22,-82 -32,-104 0,-94 32,-104 22,-82" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
      <circle cx="0" cy="-94" r="6" fill="#FFFBEB"/>
      <circle cx="0" cy="-56" r="23" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>

      <!-- Thorax -->
      <polygon points="0,-32 26,-15 26,17 0,34 -26,17 -26,-15" fill="#F59E0B" stroke="#D97706" stroke-width="4"/>
      <circle cx="0" cy="1" r="7" fill="#FFFBEB"/>

      <!-- Abdomen -->
      <path d="M -24,42 Q 0,50 24,42 L 20,60 Q 0,68 -20,60 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <path d="M -18,64 Q 0,72 18,64 L 14,80 Q 0,88 -14,80 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <polygon points="-10,84 10,84 0,108" fill="#D97706"/>
    </g>
  </g>
</svg>
